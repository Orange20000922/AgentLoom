name: Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_CODEGEN_UNITS: "16"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  linux-tests:
    name: Linux Release Tests
    runs-on: ubuntu-24.04
    env:
      CACHE_PLATFORM: ubuntu-24.04
      BUILD_DIR: build/gha-linux-tests
      VCPKG_TRIPLET: x64-linux-release
      VCPKG_INSTALL_ROOT: build/linux-vcpkg-installed
      VCPKG_BINARY_CACHE: build/vcpkg-binary-cache
      VCPKG_MAX_CONCURRENCY: 4
      # 4-way cache-miss builds were slower on the 4-vCPU hosted runner; keep
      # two compiler jobs while allowing vcpkg's independent ports more concurrency.
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CCACHE_DIR: ${{ github.workspace }}/build/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_CACHE_VERSION: v2
      MIN_FREE_DISK_GIB: 35
      DEPS_CACHE_VERSION: v2
      ONNXRUNTIME_URL: https://github.com/microsoft/onnxruntime/releases/download/v1.17.1/onnxruntime-linux-x64-1.17.1.tgz
      ONNXRUNTIME_ARCHIVE: deps/onnxruntime-linux-x64-1.17.1.tgz
      ONNXRUNTIME_ROOT: deps/onnxruntime-linux-x64-1.17.1
      SQLITE_AMALGAMATION_URL: https://www.sqlite.org/2026/sqlite-amalgamation-3530100.zip
      FAISS_CONDA_URL: https://conda.anaconda.org/conda-forge/linux-64/libfaiss-1.10.0-cpu_openblas_hfcc2109_0.conda
      FAISS_CONDA_SHA256: AA98AC39455E19DCB03A25A2164E1358A33041736E982683D468FB28F46D9FF0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate versioned build inputs
        shell: bash
        run: bash ./.github/scripts/validate-build-inputs.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: .github/workflows/ci.yml

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install zstandard "httpx>=0.27,<1" "psutil>=5.9,<8"

      - name: Test streaming benchmark parser
        run: python tests/tools/gateway_stream_benchmark_test.py

      - name: Report runner resources
        shell: bash
        run: |
          echo "logical_cpus=$(nproc)"
          free -h
          df -h "$GITHUB_WORKSPACE"

      - name: Ensure build disk space
        shell: bash
        run: bash ./.github/scripts/ensure-disk-space.sh

      - name: Install build tools and prebuilt small packages
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ccache \
            curl \
            ninja-build \
            pkg-config \
            tar \
            unzip \
            zip \
            libopenblas-dev

      - name: Restore vcpkg binary cache
        id: restore-vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: build/vcpkg-binary-cache
          key: ${{ env.CACHE_PLATFORM }}-${{ env.VCPKG_TRIPLET }}-vcpkg-features-tests-${{ hashFiles('vcpkg.json', 'triplets/ci/x64-linux-release.cmake') }}
          restore-keys: |
            ${{ env.CACHE_PLATFORM }}-${{ env.VCPKG_TRIPLET }}-vcpkg-features-tests-
            ${{ env.CACHE_PLATFORM }}-${{ env.VCPKG_TRIPLET }}-vcpkg-

      - name: Restore binary dependency archives
        id: restore-dependency-archives
        uses: actions/cache/restore@v4
        with:
          path: |
            deps/*.tgz
            deps/*.tar.gz
            deps/*.zip
            deps/*.conda
          key: ${{ env.CACHE_PLATFORM }}-ci-deps-${{ env.DEPS_CACHE_VERSION }}
          restore-keys: |
            ${{ env.CACHE_PLATFORM }}-ci-deps-

      - name: Restore compiler outputs
        id: restore-compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ env.CACHE_PLATFORM }}-${{ env.VCPKG_TRIPLET }}-ccache-${{ env.CCACHE_CACHE_VERSION }}-${{ github.sha }}
          restore-keys: |
            ${{ env.CACHE_PLATFORM }}-${{ env.VCPKG_TRIPLET }}-ccache-${{ env.CCACHE_CACHE_VERSION }}-

      - name: Cache Rust dependencies and tokenizer outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: hf-tokenizers-v1
          workspaces: third_party/hf_tokenizers_capi -> target

      - name: Verify tokenizer FFI
        working-directory: third_party/hf_tokenizers_capi
        run: |
          cargo fmt -- --check
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings
          cargo build --locked --release
          c++ -std=c++20 -Iinclude tests/ffi_smoke.cpp \
            target/release/libhf_tokenizers_capi.a \
            -lpthread -ldl -lm -o target/ffi_smoke
          target/ffi_smoke

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          vcpkg_baseline="$(python - <<'PY'
          import json
          import pathlib
          print(json.loads(pathlib.Path("vcpkg.json").read_text(encoding="utf-8"))["builtin-baseline"])
          PY
          )"
          git init vcpkg
          git -C vcpkg remote add origin https://github.com/microsoft/vcpkg.git
          # vcpkg versioning resolves historical port git trees. A depth-1 clone
          # lacks those objects and fails while loading versioned ports.
          git -C vcpkg fetch --no-tags origin "$vcpkg_baseline"
          git -C vcpkg checkout --detach FETCH_HEAD
          test "$(git -C vcpkg rev-parse --is-shallow-repository)" = "false"
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          ./vcpkg/vcpkg install \
            --triplet "$VCPKG_TRIPLET" \
            --host-triplet "$VCPKG_TRIPLET" \
            --x-feature=tests \
            --x-manifest-root="$GITHUB_WORKSPACE" \
            --x-install-root="$GITHUB_WORKSPACE/$VCPKG_INSTALL_ROOT" \
            --overlay-triplets="$GITHUB_WORKSPACE/triplets/ci" \
            "--binarysource=clear;files,$GITHUB_WORKSPACE/$VCPKG_BINARY_CACHE,readwrite" \
            --clean-after-build
          ln -s "$GITHUB_WORKSPACE/$VCPKG_INSTALL_ROOT" "$GITHUB_WORKSPACE/vcpkg_installed"

      - name: Save vcpkg binary cache
        if: steps.restore-vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/vcpkg-binary-cache
          key: ${{ steps.restore-vcpkg-cache.outputs.cache-primary-key }}

      - name: Download ONNX Runtime
        shell: bash
        run: |
          chmod +x .github/scripts/download-onnxruntime.sh
          ./.github/scripts/download-onnxruntime.sh \
            "$ONNXRUNTIME_URL" \
            "$GITHUB_WORKSPACE/$ONNXRUNTIME_ARCHIVE" \
            "$GITHUB_WORKSPACE/deps" \
            "$GITHUB_WORKSPACE/$ONNXRUNTIME_ROOT"

      - name: Prepare Linux binary dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deps
          download_file() {
            local url="$1"
            local path="$2"
            if [[ -s "$path" ]]; then
              return 0
            fi
            rm -f "$path" "$path.tmp"
            curl --fail --location --retry 5 --retry-delay 5 --connect-timeout 30 "$url" -o "$path.tmp"
            test -s "$path.tmp"
            mv "$path.tmp" "$path"
          }
          ensure_zip() {
            local url="$1"
            local path="$2"
            if [[ -s "$path" ]] && ! unzip -tq "$path" >/dev/null; then
              rm -f "$path"
            fi
            download_file "$url" "$path"
            unzip -tq "$path"
          }
          ensure_tgz() {
            local url="$1"
            local path="$2"
            if [[ -s "$path" ]] && ! tar -tzf "$path" >/dev/null; then
              rm -f "$path"
            fi
            download_file "$url" "$path"
            tar -tzf "$path" >/dev/null
          }
          ensure_conda() {
            local url="$1"
            local path="$2"
            local expected_sha256="$3"
            if [[ -s "$path" ]] && ! python - "$path" <<'PY'
          import sys, zipfile
          raise SystemExit(0 if zipfile.is_zipfile(sys.argv[1]) else 1)
          PY
            then
              rm -f "$path"
            fi
            download_file "$url" "$path"
            actual_sha256="$(sha256sum "$path" | awk '{print toupper($1)}')"
            if [[ "$actual_sha256" != "${expected_sha256^^}" ]]; then
              rm -f "$path"
              echo "SHA-256 verification failed for $url" >&2
              return 1
            fi
          }
          if [[ ! -d deps/sqlite-amalgamation-3530100 ]]; then
            ensure_zip "$SQLITE_AMALGAMATION_URL" deps/sqlite-amalgamation-3530100.zip
            unzip -q deps/sqlite-amalgamation-3530100.zip -d deps
          fi

          if [[ ! -d deps/eigen-5.0.1 ]]; then
            ensure_zip https://gitlab.com/libeigen/eigen/-/archive/5.0.1/eigen-5.0.1.zip deps/eigen-5.0.1.zip
            unzip -q deps/eigen-5.0.1.zip -d deps
          fi

          if [[ ! -d deps/boost_1_85_0 ]]; then
            ensure_tgz https://archives.boost.io/release/1.85.0/source/boost_1_85_0.tar.gz deps/boost_1_85_0.tar.gz
            tar -xzf deps/boost_1_85_0.tar.gz -C deps
          fi

          if [[ ! -f deps/faiss-1.10.0-cpu-linux/include/faiss/IndexFlat.h ||
                ! -f deps/faiss-1.10.0-cpu-linux/lib/libfaiss.so ]]; then
            rm -rf deps/faiss-1.10.0-cpu-linux
            ensure_conda "$FAISS_CONDA_URL" deps/libfaiss-linux.conda "$FAISS_CONDA_SHA256"
            python .github/scripts/extract-conda-package.py \
              deps/libfaiss-linux.conda deps/faiss-1.10.0-cpu-linux
            if [[ ! -f deps/faiss-1.10.0-cpu-linux/lib/libfaiss.so ]]; then
              found="$(find deps/faiss-1.10.0-cpu-linux -name 'libfaiss.so*' -type f | head -n 1)"
              test -n "$found"
              mkdir -p deps/faiss-1.10.0-cpu-linux/lib
              cp "$found" deps/faiss-1.10.0-cpu-linux/lib/libfaiss.so
            fi
            test -f deps/faiss-1.10.0-cpu-linux/include/faiss/IndexFlat.h
            test -f deps/faiss-1.10.0-cpu-linux/lib/libfaiss.so
          fi

      - name: Save binary dependency archives
        if: steps.restore-dependency-archives.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            deps/*.tgz
            deps/*.tar.gz
            deps/*.zip
            deps/*.conda
          key: ${{ steps.restore-dependency-archives.outputs.cache-primary-key }}

      - name: Verify Linux native dependencies
        shell: bash
        run: |
          set -euo pipefail
          openblas_path="$(ldconfig -p | awk '/libopenblas\.so/ && !found {print $NF; found=1}')"
          if [[ -z "$openblas_path" || ! -f "$openblas_path" ]]; then
            echo "libopenblas.so was not found after installing libopenblas-dev" >&2
            ldconfig -p | grep -i blas >&2 || true
            exit 1
          fi
          test -f deps/faiss-1.10.0-cpu-linux/include/faiss/IndexFlat.h
          test -f deps/faiss-1.10.0-cpu-linux/lib/libfaiss.so
          echo "BERT_OPENBLAS_LIBRARY=$openblas_path" >> "$GITHUB_ENV"
          echo "Using OpenBLAS: $openblas_path"

      - name: Configure tests
        shell: bash
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size=500M
          ccache --zero-stats || true
          ccache --show-config
          cmake -S . -B "$BUILD_DIR" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBERT_BUILD_TESTS=ON \
            -DBERT_BUILD_MULTIMODAL_INFERENCE_SERVER=OFF \
            -DBERT_VCPKG_TRIPLET="$VCPKG_TRIPLET" \
            -DBERT_USE_ONNXRUNTIME_GPU=OFF \
            -DBERT_OPENBLAS_LIBRARY="$BERT_OPENBLAS_LIBRARY" \
            -DONNXRUNTIME_CPU_ROOT="$GITHUB_WORKSPACE/$ONNXRUNTIME_ROOT" \
            -DAGENTLOOM_BUILD_LOCAL_LLM=OFF \
            -DAGENTLOOM_BUILD_MEDIA=OFF

      - name: Build SDK and test targets
        shell: bash
        run: |
          cmake --build "$BUILD_DIR" --target \
            agentloom_sdk \
            core_tests \
            net_tests \
            http_client_tests \
            llm_tests \
            llm_streaming_tests \
            tls_tests \
            storage_tests \
            semantic_cache_tests \
            document_tests \
            config_tests \
            persona_runtime_tests \
            gateway_service_tests \
            async_grpc_runtime_tests \
            --parallel
          ccache --show-stats --verbose || true

      - name: Save compiler outputs
        if: always() && steps.restore-compiler-cache.outcome == 'success' && steps.restore-compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore-compiler-cache.outputs.cache-primary-key }}

      - name: Run tests
        shell: bash
        run: |
          ctest --test-dir "$BUILD_DIR" -C Release \
            -L ci -E "(ReloadBatchCycle|RedisV2Batches)" \
            --output-on-failure

      - name: Verify installed package consumer
        shell: bash
        run: |
          cmake \
            -DAGENTLOOM_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DAGENTLOOM_PACKAGE_BUILD_DIR="$GITHUB_WORKSPACE/$BUILD_DIR" \
            -DAGENTLOOM_INSTALL_PREFIX="$GITHUB_WORKSPACE/build/gha-linux-tests-install" \
            -DAGENTLOOM_CONSUMER_BUILD_DIR="$GITHUB_WORKSPACE/build/gha-linux-tests-consumer" \
            -DAGENTLOOM_CONSUMER_GENERATOR=Ninja \
            -DAGENTLOOM_CONSUMER_BUILD_TYPE=Release \
            -DAGENTLOOM_CONSUMER_TOOLCHAIN_FILE="$GITHUB_WORKSPACE/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DAGENTLOOM_CONSUMER_TRIPLET="$VCPKG_TRIPLET" \
            -DAGENTLOOM_CONSUMER_VCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/$VCPKG_INSTALL_ROOT" \
            -DAGENTLOOM_CONSUMER_BOOST_ROOT="$GITHUB_WORKSPACE/deps/boost_1_85_0" \
            -P cmake/AgentLoomPackageConsumerTest.cmake
