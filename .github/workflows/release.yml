name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  # Match the measured CI optimum for full C++ cache-miss builds.
  CMAKE_BUILD_PARALLEL_LEVEL: 2
  VCPKG_MAX_CONCURRENCY: 4
  CCACHE_DIR: ${{ github.workspace }}/build/ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPILERCHECK: content
  CCACHE_CACHE_VERSION: v2
  MIN_FREE_DISK_GIB: 35

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu Release
            os: ubuntu-24.04
            triplet: x64-linux-release
            build_dir: build/gha-linux
            artifact_dir: build/gha-linux
            ort_url: https://github.com/microsoft/onnxruntime/releases/download/v1.17.1/onnxruntime-linux-x64-1.17.1.tgz
            ort_archive: deps/onnxruntime-linux-x64-1.17.1.tgz
            ort_root: deps/onnxruntime-linux-x64-1.17.1
            package_name: bert-inference-linux-x64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate versioned build inputs
        shell: bash
        run: bash ./.github/scripts/validate-build-inputs.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: .github/workflows/release.yml

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install onnx grpcio protobuf

      - name: Report runner resources
        shell: bash
        run: |
          echo "logical_cpus=$(nproc)"
          free -h
          df -h "$GITHUB_WORKSPACE"

      - name: Ensure build disk space
        shell: bash
        run: bash ./.github/scripts/ensure-disk-space.sh

      - name: Restore vcpkg binary cache
        id: restore-vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: build/vcpkg-binary-cache
          key: ${{ matrix.os }}-${{ matrix.triplet }}-vcpkg-features-core-${{ hashFiles('vcpkg.json', 'triplets/ci/x64-linux-release.cmake') }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.triplet }}-vcpkg-features-core-
            ${{ matrix.os }}-${{ matrix.triplet }}-vcpkg-

      - name: Cache ONNX Runtime archive
        uses: actions/cache@v4
        with:
          path: ${{ matrix.ort_archive }}
          key: ${{ matrix.os }}-ort-release-${{ hashFiles('.github/workflows/release.yml') }}-${{ matrix.ort_archive }}

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config curl tar unzip zip ccache

      - name: Restore compiler outputs
        id: restore-compiler-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ matrix.os }}-${{ matrix.triplet }}-ccache-${{ env.CCACHE_CACHE_VERSION }}-${{ github.sha }}
          restore-keys: |
            ${{ matrix.os }}-${{ matrix.triplet }}-ccache-${{ env.CCACHE_CACHE_VERSION }}-

      - name: Cache Rust dependencies and tokenizer outputs
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: hf-tokenizers-release-v1
          workspaces: third_party/hf_tokenizers_capi -> target

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          vcpkg_baseline="$(python - <<'PY'
          import json
          import pathlib
          print(json.loads(pathlib.Path("vcpkg.json").read_text(encoding="utf-8"))["builtin-baseline"])
          PY
          )"
          git init vcpkg
          git -C vcpkg remote add origin https://github.com/microsoft/vcpkg.git
          # vcpkg versioning resolves historical port git trees. A depth-1 clone
          # lacks those objects and fails while loading versioned ports.
          git -C vcpkg fetch --no-tags origin "$vcpkg_baseline"
          git -C vcpkg checkout --detach FETCH_HEAD
          test "$(git -C vcpkg rev-parse --is-shallow-repository)" = "false"
          ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Install dependencies
        shell: bash
        run: |
          ./vcpkg/vcpkg install \
            --triplet ${{ matrix.triplet }} \
            --host-triplet ${{ matrix.triplet }} \
            --x-manifest-root="$GITHUB_WORKSPACE" \
            --x-install-root="$GITHUB_WORKSPACE/build/linux-vcpkg-installed" \
            --overlay-triplets="$GITHUB_WORKSPACE/triplets/ci" \
            "--binarysource=clear;files,$GITHUB_WORKSPACE/build/vcpkg-binary-cache,readwrite" \
            --clean-after-build
          ln -s "$GITHUB_WORKSPACE/build/linux-vcpkg-installed" "$GITHUB_WORKSPACE/vcpkg_installed"

      - name: Save vcpkg binary cache
        if: steps.restore-vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/vcpkg-binary-cache
          key: ${{ steps.restore-vcpkg-cache.outputs.cache-primary-key }}

      - name: Download ONNX Runtime
        shell: bash
        run: |
          chmod +x .github/scripts/download-onnxruntime.sh
          ./.github/scripts/download-onnxruntime.sh \
            "${{ matrix.ort_url }}" \
            "${{ github.workspace }}/${{ matrix.ort_archive }}" \
            "${{ github.workspace }}/deps" \
            "${{ github.workspace }}/${{ matrix.ort_root }}"

      - name: Configure
        shell: bash
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=cache_dir="$CCACHE_DIR"
          ccache --set-config=max_size=500M
          ccache --zero-stats || true
          ccache --show-config
          cmake -S . -B "${{ matrix.build_dir }}" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBERT_VCPKG_TRIPLET=${{ matrix.triplet }} \
            -DBERT_USE_ONNXRUNTIME_GPU=OFF \
            -DONNXRUNTIME_CPU_ROOT="${{ github.workspace }}/${{ matrix.ort_root }}"

      - name: Build
        shell: bash
        run: |
          cmake --build "${{ matrix.build_dir }}" --parallel
          ccache --show-stats --verbose || true

      - name: Save compiler outputs
        if: always() && steps.restore-compiler-cache.outcome == 'success' && steps.restore-compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ${{ steps.restore-compiler-cache.outputs.cache-primary-key }}

      - name: Generate smoke-test model
        run: |
          python .github/scripts/create_smoke_test_model.py --output build/smoke/bert_smoke_test.onnx

      - name: Run smoke test
        shell: bash
        run: |
          python .github/scripts/run_smoke_test.py \
            --server "${{ github.workspace }}/${{ matrix.artifact_dir }}/bert_inference_server" \
            --client "${{ github.workspace }}/${{ matrix.artifact_dir }}/bert_inference_client" \
            --model "${{ github.workspace }}/build/smoke/bert_smoke_test.onnx" \
            --health-probe "${{ github.workspace }}/tools/grpc_health_probe.py" \
            --target 127.0.0.1:50051

      - name: Package release
        shell: bash
        run: |
          stage_dir="$GITHUB_WORKSPACE/dist/linux-x64"
          mkdir -p "$stage_dir"
          cp README.md "$stage_dir/"
          cp tools/grpc_health_probe.py "$stage_dir/"
          cp "${{ matrix.artifact_dir }}/bert_inference_server" "$stage_dir/"
          cp "${{ matrix.artifact_dir }}/bert_inference_client" "$stage_dir/"
          cp "${{ matrix.artifact_dir }}/bert_benchmark_client" "$stage_dir/"
          shopt -s nullglob
          for sofile in "${{ matrix.artifact_dir }}"/*.so*; do
            cp "$sofile" "$stage_dir/"
          done
          tar -C "$GITHUB_WORKSPACE/dist" -czf "$GITHUB_WORKSPACE/dist/${{ matrix.package_name }}" linux-x64

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-package-${{ matrix.triplet }}
          if-no-files-found: error
          path: dist/${{ matrix.package_name }}

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: release-package-*
          merge-multiple: true
          path: dist

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            dist/*
